<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ルートフライオーバー</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root{
    --bg:#0e1116;
    --panel:#161b22;
    --accent:#ff6b35;
    --accent2:#ffb84d;
    --text:#e6edf3;
    --muted:#8b949e;
    --line:#2d333b;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:var(--bg);color:var(--text);overflow:hidden;}
  #map{position:absolute;inset:0;}

  /* ヘッダー */
  .topbar{
    position:absolute;top:0;left:0;right:0;z-index:10;
    display:flex;align-items:center;gap:10px;
    padding:12px 14px;
    background:linear-gradient(180deg, rgba(14,17,22,.92) 0%, rgba(14,17,22,0) 100%);
    pointer-events:none;
  }
  .title{
    font-weight:800;letter-spacing:.04em;font-size:17px;
    display:flex;align-items:center;gap:8px;
    text-shadow:0 1px 4px rgba(0,0,0,.6);
  }
  .title .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);}
  .phase{font-size:11px;color:var(--muted);font-weight:600;margin-left:auto;text-shadow:0 1px 4px rgba(0,0,0,.6);}

  /* 読み込みボタン（中央の最初の状態） */
  .loader{
    position:absolute;inset:0;z-index:20;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:radial-gradient(circle at 50% 40%, rgba(255,107,53,.10), transparent 60%), var(--bg);
    padding:24px;text-align:center;
  }
  .loader h1{font-size:24px;font-weight:800;letter-spacing:.02em;}
  .loader p{color:var(--muted);font-size:13px;line-height:1.7;max-width:300px;}
  .filebtn{
    position:relative;overflow:hidden;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#1a1207;font-weight:800;font-size:15px;
    border:none;border-radius:14px;padding:16px 30px;
    box-shadow:0 8px 24px rgba(255,107,53,.35);
    cursor:pointer;letter-spacing:.03em;
  }
  .filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;}
  .hint{font-size:11px;color:var(--muted);}

  /* 下部コントロール */
  .controls{
    position:absolute;left:0;right:0;bottom:0;z-index:10;
    padding:14px 14px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg, rgba(14,17,22,.94) 30%, rgba(14,17,22,0) 100%);
    display:none;
  }
  .controls.show{display:block;}
  .stats{
    display:flex;gap:8px;margin-bottom:12px;
  }
  .stat{
    flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:9px 10px;text-align:center;
  }
  .stat .v{font-size:17px;font-weight:800;color:var(--accent2);line-height:1.1;}
  .stat .l{font-size:10px;color:var(--muted);margin-top:3px;letter-spacing:.05em;}
  .btnrow{display:flex;gap:10px;}
  .ctrlbtn{
    flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);
    border-radius:12px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:7px;
  }
  .ctrlbtn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1a1207;border:none;}
  .ctrlbtn:active{transform:scale(.97);}

  .toast{
    position:absolute;top:54px;left:50%;transform:translateX(-50%);z-index:30;
    background:var(--panel);border:1px solid var(--line);color:var(--text);
    padding:10px 16px;border-radius:10px;font-size:13px;
    box-shadow:0 6px 20px rgba(0,0,0,.4);opacity:0;transition:opacity .3s;pointer-events:none;
    white-space:nowrap;
  }
  .toast.show{opacity:1;}
  .maplibregl-ctrl-attrib{font-size:9px;}
</style>
</head>
<body>
<div id="map"></div>

<div class="topbar">
  <div class="title"><span class="dot"></span>ルートフライオーバー</div>
  <div class="phase">Phase 1</div>
</div>

<div class="toast" id="toast"></div>

<div class="loader" id="loader">
  <h1>🏍 走行ルートを<br>3Dマップに</h1>
  <p>Geo TrackerなどでエクスポートしたGPXファイルを選んでください。端末のDownloadフォルダなどから読み込めます。</p>
  <button class="filebtn">
    GPXファイルを選ぶ
    <input type="file" id="fileInput" accept=".gpx,application/gpx+xml,text/xml">
  </button>
  <div class="hint">対応形式: .gpx</div>
</div>

<div class="controls" id="controls">
  <div class="stats">
    <div class="stat"><div class="v" id="statDist">–</div><div class="l">距離 km</div></div>
    <div class="stat"><div class="v" id="statUp">–</div><div class="l">獲得標高 m</div></div>
    <div class="stat"><div class="v" id="statPts">–</div><div class="l">ポイント数</div></div>
  </div>
  <div class="btnrow">
    <button class="ctrlbtn" id="btnFit">🗺 全体表示</button>
    <button class="ctrlbtn primary">
      別のGPX
      <input type="file" id="fileInput2" accept=".gpx,application/gpx+xml,text/xml" style="position:absolute;inset:0;opacity:0;">
    </button>
  </div>
</div>

<script>
// ---- 無料・キー不要の構成 ----
// 地図ベース: CARTO のラスタタイル（ダーク）
// 3D地形: AWS Terrarium タイル（標高、キー不要）
const style = {
  version: 8,
  sources: {
    basemap: {
      type: 'raster',
      tiles: ['https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
              'https://b.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
              'https://c.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png'],
      tileSize: 256,
      attribution: '© OpenStreetMap © CARTO'
    },
    terrain: {
      type: 'raster-dem',
      tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
      tileSize: 256,
      encoding: 'terrarium',
      maxzoom: 14,
      attribution: 'Terrain: Mapzen / AWS'
    }
  },
  layers: [
    { id: 'bg', type: 'background', paint: { 'background-color': '#0e1116' } },
    { id: 'basemap', type: 'raster', source: 'basemap' }
  ]
};

const map = new maplibregl.Map({
  container: 'map',
  style: style,
  center: [130.7, 31.5], // 初期: 鹿児島あたり
  zoom: 8,
  pitch: 0,
  attributionControl: { compact: true }
});

map.on('load', () => {
  map.setTerrain({ source: 'terrain', exaggeration: 1.3 });
});

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2600);
}

// ---- GPXパース ----
function parseGPX(text){
  const xml = new DOMParser().parseFromString(text, 'application/xml');
  if (xml.querySelector('parsererror')) throw new Error('GPXの解析に失敗しました');
  // trkpt 優先、無ければ rtept / wpt
  let pts = [...xml.querySelectorAll('trkpt')];
  if (pts.length === 0) pts = [...xml.querySelectorAll('rtept')];
  if (pts.length === 0) pts = [...xml.querySelectorAll('wpt')];
  const coords = [];
  for (const p of pts){
    const lat = parseFloat(p.getAttribute('lat'));
    const lon = parseFloat(p.getAttribute('lon'));
    if (isNaN(lat) || isNaN(lon)) continue;
    const eleEl = p.querySelector('ele');
    const ele = eleEl ? parseFloat(eleEl.textContent) : null;
    const timeEl = p.querySelector('time');
    const time = timeEl ? timeEl.textContent : null;
    coords.push({ lon, lat, ele, time });
  }
  if (coords.length < 2) throw new Error('ルートの点が足りません（2点以上必要）');
  return coords;
}

// ---- 距離・標高計算 ----
function haversine(a, b){
  const R = 6371000, toRad = d => d*Math.PI/180;
  const dLat = toRad(b.lat-a.lat), dLon = toRad(b.lon-a.lon);
  const s = Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function computeStats(coords){
  let dist = 0, up = 0;
  for (let i=1;i<coords.length;i++){
    dist += haversine(coords[i-1], coords[i]);
    if (coords[i].ele!=null && coords[i-1].ele!=null){
      const d = coords[i].ele - coords[i-1].ele;
      if (d > 0) up += d;
    }
  }
  return { distKm: dist/1000, upM: up, n: coords.length };
}

// ---- ルート描画 ----
let currentBounds = null;
function drawRoute(coords){
  const line = coords.map(c => [c.lon, c.lat]);
  const geojson = { type:'Feature', geometry:{ type:'LineString', coordinates: line } };

  // 既存削除
  for (const id of ['route-line','route-glow','route-start','route-end']){
    if (map.getLayer(id)) map.removeLayer(id);
  }
  for (const id of ['route','route-ends']){
    if (map.getSource(id)) map.removeSource(id);
  }

  map.addSource('route', { type:'geojson', data: geojson });
  // グロー（太く半透明）
  map.addLayer({ id:'route-glow', type:'line', source:'route',
    layout:{'line-cap':'round','line-join':'round'},
    paint:{'line-color':'#ff6b35','line-width':12,'line-opacity':0.25,'line-blur':6} });
  // 本線
  map.addLayer({ id:'route-line', type:'line', source:'route',
    layout:{'line-cap':'round','line-join':'round'},
    paint:{'line-color':'#ffb84d','line-width':4} });

  // 始点・終点マーカー
  const ends = { type:'FeatureCollection', features:[
    { type:'Feature', properties:{kind:'start'}, geometry:{type:'Point', coordinates: line[0]} },
    { type:'Feature', properties:{kind:'end'}, geometry:{type:'Point', coordinates: line[line.length-1]} }
  ]};
  map.addSource('route-ends', { type:'geojson', data: ends });
  map.addLayer({ id:'route-start', type:'circle', source:'route-ends',
    filter:['==','kind','start'],
    paint:{'circle-radius':7,'circle-color':'#2ecc71','circle-stroke-width':2,'circle-stroke-color':'#fff'} });
  map.addLayer({ id:'route-end', type:'circle', source:'route-ends',
    filter:['==','kind','end'],
    paint:{'circle-radius':7,'circle-color':'#e74c3c','circle-stroke-width':2,'circle-stroke-color':'#fff'} });

  // 範囲計算
  const b = new maplibregl.LngLatBounds();
  for (const p of line) b.extend(p);
  currentBounds = b;
  fitRoute();
}

function fitRoute(){
  if (!currentBounds) return;
  map.fitBounds(currentBounds, { padding: 60, pitch: 55, duration: 1400 });
}

// ---- ファイル読み込み ----
function handleFile(file){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const coords = parseGPX(e.target.result);
      const stats = computeStats(coords);
      document.getElementById('statDist').textContent = stats.distKm.toFixed(1);
      document.getElementById('statUp').textContent = Math.round(stats.upM);
      document.getElementById('statPts').textContent = stats.n;
      window._coords = coords; // 後のPhaseで使う

      const draw = () => drawRoute(coords);
      if (map.isStyleLoaded()) draw(); else map.once('idle', draw);

      document.getElementById('loader').style.display = 'none';
      document.getElementById('controls').classList.add('show');
      toast(`読み込み完了：${stats.n}点 / ${stats.distKm.toFixed(1)}km`);
    }catch(err){
      toast('⚠ ' + err.message);
      console.error(err);
    }
  };
  reader.onerror = () => toast('⚠ ファイルの読み込みに失敗しました');
  reader.readAsText(file);
}

document.getElementById('fileInput').addEventListener('change', e => handleFile(e.target.files[0]));
document.getElementById('fileInput2').addEventListener('change', e => handleFile(e.target.files[0]));
document.getElementById('btnFit').addEventListener('click', fitRoute);
</script>
</body>
</html>
