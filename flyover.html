<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ルートフライオーバー</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root{
    --bg:#0e1116;
    --panel:#161b22;
    --accent:#ff6b35;
    --accent2:#ffb84d;
    --text:#e6edf3;
    --muted:#8b949e;
    --line:#2d333b;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:var(--bg);color:var(--text);overflow:hidden;}
  #map{position:absolute;inset:0;}

  .topbar{
    position:absolute;top:0;left:0;right:0;z-index:10;
    display:flex;align-items:center;gap:10px;
    padding:12px 14px;
    background:linear-gradient(180deg, rgba(14,17,22,.92) 0%, rgba(14,17,22,0) 100%);
    pointer-events:none;
  }
  .title{
    font-weight:800;letter-spacing:.04em;font-size:17px;
    display:flex;align-items:center;gap:8px;
    text-shadow:0 1px 4px rgba(0,0,0,.6);
  }
  .title .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);}
  .phase{font-size:11px;color:var(--muted);font-weight:600;margin-left:auto;text-shadow:0 1px 4px rgba(0,0,0,.6);}

  .loader{
    position:absolute;inset:0;z-index:20;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:radial-gradient(circle at 50% 40%, rgba(255,107,53,.10), transparent 60%), var(--bg);
    padding:24px;text-align:center;
  }
  .loader h1{font-size:24px;font-weight:800;letter-spacing:.02em;}
  .loader p{color:var(--muted);font-size:13px;line-height:1.7;max-width:300px;}
  .filebtn{
    position:relative;overflow:hidden;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#1a1207;font-weight:800;font-size:15px;
    border:none;border-radius:14px;padding:16px 30px;
    box-shadow:0 8px 24px rgba(255,107,53,.35);
    cursor:pointer;letter-spacing:.03em;
  }
  .filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;}
  .hint{font-size:11px;color:var(--muted);}

  .controls{
    position:absolute;left:0;right:0;bottom:0;z-index:10;
    padding:14px 14px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg, rgba(14,17,22,.94) 35%, rgba(14,17,22,0) 100%);
    display:none;
  }
  .controls.show{display:block;}

  .stats{display:flex;gap:8px;margin-bottom:12px;}
  .stat{
    flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:9px 10px;text-align:center;
  }
  .stat .v{font-size:17px;font-weight:800;color:var(--accent2);line-height:1.1;}
  .stat .l{font-size:10px;color:var(--muted);margin-top:3px;letter-spacing:.05em;}

  /* 進捗バー */
  .progress-wrap{margin-bottom:12px;}
  .progress-bar{
    position:relative;height:6px;background:var(--line);border-radius:3px;overflow:hidden;cursor:pointer;
  }
  .progress-fill{
    position:absolute;left:0;top:0;bottom:0;width:0%;
    background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;
  }
  .progress-info{
    display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px;
  }
  .progress-info .cur{color:var(--accent2);font-weight:700;}

  /* 再生コントロール */
  .playrow{display:flex;gap:10px;align-items:center;justify-content:center;margin-bottom:10px;}
  .playbtn{
    width:60px;height:60px;flex:none;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1a1207;
    border:none;border-radius:50%;font-size:24px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(255,107,53,.4);
  }
  .playbtn:active{transform:scale(.94);}

  /* カメラ切替 */
  .camrow{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
  .camlabel{font-size:12px;color:var(--muted);font-weight:700;flex:none;}
  .cambtn{
    flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:10px 6px;font-size:12px;font-weight:700;cursor:pointer;
  }
  .cambtn:active{transform:scale(.97);}
  .cambtn.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1a1207;border:none;}

  .btnrow{display:flex;gap:10px;}
  .ctrlbtn{
    flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);
    border-radius:12px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;position:relative;overflow:hidden;
  }
  .ctrlbtn:active{transform:scale(.97);}

  .toast{
    position:absolute;top:54px;left:50%;transform:translateX(-50%);z-index:30;
    background:var(--panel);border:1px solid var(--line);color:var(--text);
    padding:10px 16px;border-radius:10px;font-size:13px;
    box-shadow:0 6px 20px rgba(0,0,0,.4);opacity:0;transition:opacity .3s;pointer-events:none;
    white-space:nowrap;
  }
  .toast.show{opacity:1;}
  .maplibregl-ctrl-attrib{font-size:9px;}
  /* シネマモード */
  .topbar,.controls{transition:opacity .45s ease;}
  #cinema-overlay{position:absolute;top:12px;left:12px;z-index:15;pointer-events:none;display:none;}
  #elevCanvas{display:block;border-radius:10px;background:rgba(14,17,22,.78);}
  #cinema-stats{display:flex;gap:6px;margin-top:5px;}
  .cs-badge{background:rgba(14,17,22,.78);border-radius:20px;padding:4px 10px;font-size:12px;font-weight:800;color:var(--accent2);letter-spacing:.02em;}
</style>
</head>
<body>
<div id="map"></div>

<div class="topbar" id="topbar">
  <div class="title"><span class="dot"></span>ルートフライオーバー</div>
  <div class="phase">Phase 3</div>
</div>

<div class="toast" id="toast"></div>
<div id="cinema-overlay">
  <canvas id="elevCanvas" width="160" height="54"></canvas>
  <div id="cinema-stats">
    <span class="cs-badge" id="cinemaEle">↑ –</span>
    <span class="cs-badge" id="cinemaDist">– km</span>
  </div>
</div>

<div class="loader" id="loader">
  <h1>🏍 走行ルートを<br>3Dマップに</h1>
  <p>Geo TrackerなどでエクスポートしたGPXファイルを選んでください。端末のDownloadフォルダなどから読み込めます。</p>
  <button class="filebtn">
    GPXファイルを選ぶ
    <input type="file" id="fileInput" accept=".gpx,application/gpx+xml,text/xml">
  </button>
  <div class="hint">対応形式: .gpx</div>
</div>

<div class="controls" id="controls">
  <div class="stats">
    <div class="stat"><div class="v" id="statDist">–</div><div class="l">距離 km</div></div>
    <div class="stat"><div class="v" id="statUp">–</div><div class="l">獲得標高 m</div></div>
    <div class="stat"><div class="v" id="statEle">–</div><div class="l">現在標高 m</div></div>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-info">
      <span class="cur" id="curDist">0.0 km</span>
      <span id="totDist">/ – km</span>
    </div>
  </div>

  <div class="playrow">
    <button class="playbtn" id="btnPlay">▶</button>
  </div>

  <div class="camrow">
    <span class="camlabel">📷 カメラ</span>
    <button class="cambtn" data-cam="off">全体</button>
    <button class="cambtn active" data-cam="follow">俯瞰追従</button>
    <button class="cambtn" data-cam="chase">追走</button>
  </div>

  <div class="btnrow">
    <button class="ctrlbtn" id="btnReset">⏮ 最初へ</button>
    <button class="ctrlbtn" id="btnFit">🗺 全体表示</button>
    <button class="ctrlbtn">
      別のGPX
      <input type="file" id="fileInput2" accept=".gpx,application/gpx+xml,text/xml" style="position:absolute;inset:0;opacity:0;">
    </button>
    <button class="ctrlbtn" id="btnCinema">🎬 シネマ</button>
  </div>
</div>

<script>
const style = {
  version: 8,
  sources: {
    satellite: {
      type: 'raster',
      // Esri World Imagery — APIキー不要・商用利用可・高ズーム対応
      // 注意: Esri タイルは {z}/{y}/{x} 順（MapLibre標準の {z}/{x}/{y} と逆）
      tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
      tileSize: 256,
      maxzoom: 19,
      attribution: 'Tiles © Esri — Esri, Maxar, Earthstar Geographics'
    },
    terrain: {
      type: 'raster-dem',
      tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
      tileSize: 256, encoding: 'terrarium', maxzoom: 14,
      attribution: 'Terrain: Mapzen / AWS'
    }
  },
  layers: [
    { id: 'bg', type: 'background', paint: { 'background-color': '#0e1116' } },
    { id: 'satellite', type: 'raster', source: 'satellite',
      paint: {
        // タイル読込時のフェードを短縮してもやつき抑制（デフォルト300ms → 100ms）
        'raster-fade-duration': 100,
        // 双線形補間でスムーズに（MapLibreデフォルト値だが明示）
        'raster-resampling': 'linear'
      }
    }
  ]
};

const map = new maplibregl.Map({
  container: 'map', style: style,
  center: [130.7, 31.5], zoom: 8, pitch: 0,
  attributionControl: { compact: true },
  // DPR=3端末でも2倍止めにしてGPU負荷を抑えつつ高精細化（1倍→2倍で視認性は大幅向上）
  pixelRatio: Math.min(window.devicePixelRatio || 1, 2)
});
map.on('load', () => { map.setTerrain({ source: 'terrain', exaggeration: 1.3 }); });

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2600);
}

// ---- GPXパース ----
function parseGPX(text){
  const xml = new DOMParser().parseFromString(text, 'application/xml');
  if (xml.querySelector('parsererror')) throw new Error('GPXの解析に失敗しました');
  let pts = [...xml.querySelectorAll('trkpt')];
  if (pts.length === 0) pts = [...xml.querySelectorAll('rtept')];
  if (pts.length === 0) pts = [...xml.querySelectorAll('wpt')];
  const coords = [];
  for (const p of pts){
    const lat = parseFloat(p.getAttribute('lat'));
    const lon = parseFloat(p.getAttribute('lon'));
    if (isNaN(lat) || isNaN(lon)) continue;
    const eleEl = p.querySelector('ele');
    const ele = eleEl ? parseFloat(eleEl.textContent) : null;
    coords.push({ lon, lat, ele });
  }
  if (coords.length < 2) throw new Error('ルートの点が足りません（2点以上必要）');
  return coords;
}

function haversine(a, b){
  const R = 6371000, toRad = d => d*Math.PI/180;
  const dLat = toRad(b.lat-a.lat), dLon = toRad(b.lon-a.lon);
  const s = Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}

// ---- 状態 ----
let LINE = [];           // [[lon,lat],...]
let ELES = [];           // 標高配列
let CUM = [];            // 各点までの累積距離(m)
let TOTAL = 0;           // 総距離(m)
let currentBounds = null;
let progress = 0;        // 0..1
let playing = false;
let rafId = null;
let lastTs = null;
let camMode = 'follow';  // 'off' | 'follow' | 'chase'
let cinemaMode = false;
let cinemaTapTimer = null;
let elevPts = [];
let elevMeta = { minE: 0, maxE: 0 };

// ---- ルート描画 ----
function buildRoute(coords){
  LINE = coords.map(c => [c.lon, c.lat]);
  ELES = coords.map(c => c.ele);
  CUM = [0];
  for (let i=1;i<coords.length;i++){
    CUM[i] = CUM[i-1] + haversine(coords[i-1], coords[i]);
  }
  TOTAL = CUM[CUM.length-1];

  // 等距離リサンプル（800点）—— Catmull-Rom スプラインの土台
  // 元のGPS点が不均等間隔でも等速で動けるよう、arc-length空間で均等配置
  {
    const N = 800;
    RS_LINE = []; RS_ELES = [];
    for (let i = 0; i < N; i++){
      const rp = sampleAt((i / (N - 1)) * TOTAL);
      RS_LINE.push([rp.pos[0], rp.pos[1]]);
      RS_ELES.push(rp.ele);
    }
  }

  // シネマ用：標高プロファイルを160点に正規化してキャッシュ
  const EP_N = 160;
  elevPts = [];
  elevMeta = { minE: Infinity, maxE: -Infinity };
  for (let i = 0; i < EP_N; i++) {
    const ep = sampleAt((i / (EP_N - 1)) * TOTAL);
    const e = ep.ele != null ? ep.ele : 0;
    elevPts.push(e);
    if (e < elevMeta.minE) elevMeta.minE = e;
    if (e > elevMeta.maxE) elevMeta.maxE = e;
  }

  // 既存レイヤ削除
  for (const id of ['route-glow','route-bg','route-done','route-start','route-end','bike-glow','bike-dot']){
    if (map.getLayer(id)) map.removeLayer(id);
  }
  for (const id of ['route','route-done','route-ends','bike']){
    if (map.getSource(id)) map.removeSource(id);
  }

  // スプライン補間済みの均等点でルートを描画（よりスムーズな曲線表示）
  const full = { type:'Feature', geometry:{ type:'LineString', coordinates: RS_LINE.length>=2 ? RS_LINE : LINE } };

  // 未走行ルート（暗め）
  map.addSource('route', { type:'geojson', data: full });
  map.addLayer({ id:'route-glow', type:'line', source:'route',
    layout:{'line-cap':'round','line-join':'round'},
    paint:{'line-color':'#ff6b35','line-width':10,'line-opacity':0.12,'line-blur':6} });
  map.addLayer({ id:'route-bg', type:'line', source:'route',
    layout:{'line-cap':'round','line-join':'round'},
    paint:{'line-color':'#6b7785','line-width':3,'line-opacity':0.55} });

  // 走行済みルート（明るく光る）
  const startPt = RS_LINE.length>=2 ? RS_LINE[0] : LINE[0];
  map.addSource('route-done', { type:'geojson', data: { type:'Feature', geometry:{ type:'LineString', coordinates: [startPt, startPt] } } });
  map.addLayer({ id:'route-done', type:'line', source:'route-done',
    layout:{'line-cap':'round','line-join':'round'},
    paint:{'line-color':'#ffb84d','line-width':5} });

  // 始点・終点
  const ends = { type:'FeatureCollection', features:[
    { type:'Feature', properties:{kind:'start'}, geometry:{type:'Point', coordinates: LINE[0]} },
    { type:'Feature', properties:{kind:'end'}, geometry:{type:'Point', coordinates: LINE[LINE.length-1]} }
  ]};
  map.addSource('route-ends', { type:'geojson', data: ends });
  map.addLayer({ id:'route-start', type:'circle', source:'route-ends',
    filter:['==','kind','start'],
    paint:{'circle-radius':6,'circle-color':'#2ecc71','circle-stroke-width':2,'circle-stroke-color':'#fff'} });
  map.addLayer({ id:'route-end', type:'circle', source:'route-ends',
    filter:['==','kind','end'],
    paint:{'circle-radius':6,'circle-color':'#e74c3c','circle-stroke-width':2,'circle-stroke-color':'#fff'} });

  // 走行マーカー（光る点）
  map.addSource('bike', { type:'geojson', data:{ type:'Feature', geometry:{ type:'Point', coordinates: LINE[0] } } });
  map.addLayer({ id:'bike-glow', type:'circle', source:'bike',
    paint:{'circle-radius':16,'circle-color':'#ff6b35','circle-opacity':0.25,'circle-blur':1} });
  map.addLayer({ id:'bike-dot', type:'circle', source:'bike',
    paint:{'circle-radius':8,'circle-color':'#ffffff','circle-stroke-width':3,'circle-stroke-color':'#ff6b35'} });

  // 範囲
  const b = new maplibregl.LngLatBounds();
  for (const p of LINE) b.extend(p);
  currentBounds = b;

  progress = 0;
  document.getElementById('totDist').textContent = '/ ' + (TOTAL/1000).toFixed(1) + ' km';
  updateScene();
  fitRoute();
}

function fitRoute(){
  if (!currentBounds) return;
  map.fitBounds(currentBounds, { padding: 70, pitch: 50, duration: 1200 });
}

// 距離(0..TOTAL)から、その地点の補間座標と標高とセグメントindexを返す
function sampleAt(distM){
  if (distM <= 0) return { pos: LINE[0], ele: ELES[0], idx: 0 };
  if (distM >= TOTAL) return { pos: LINE[LINE.length-1], ele: ELES[ELES.length-1], idx: LINE.length-1 };
  // 二分探索
  let lo=0, hi=CUM.length-1;
  while (lo < hi){
    const mid = (lo+hi)>>1;
    if (CUM[mid] < distM) lo = mid+1; else hi = mid;
  }
  const i = Math.max(1, lo);
  const segLen = CUM[i] - CUM[i-1];
  const t = segLen > 0 ? (distM - CUM[i-1]) / segLen : 0;
  const lon = LINE[i-1][0] + (LINE[i][0]-LINE[i-1][0])*t;
  const lat = LINE[i-1][1] + (LINE[i][1]-LINE[i-1][1])*t;
  let ele = null;
  if (ELES[i-1]!=null && ELES[i]!=null) ele = ELES[i-1] + (ELES[i]-ELES[i-1])*t;
  return { pos:[lon,lat], ele, idx: i };
}

// 2点間の方位角（度, 北=0, 東=90）
function bearing(a, b){
  const toRad = d => d*Math.PI/180, toDeg = r => r*180/Math.PI;
  const dLon = toRad(b[0]-a[0]);
  const y = Math.sin(dLon)*Math.cos(toRad(b[1]));
  const x = Math.cos(toRad(a[1]))*Math.sin(toRad(b[1])) - Math.sin(toRad(a[1]))*Math.cos(toRad(b[1]))*Math.cos(dLon);
  return (toDeg(Math.atan2(y,x)) + 360) % 360;
}

// 角度を最短方向で補間（-180..180をまたぐ処理）
function lerpAngle(from, to, t){
  let diff = ((to - from + 540) % 360) - 180;
  return from + diff * t;
}

// Catmull-Rom スプライン（一様パラメータ）で pts[frac*(n-1)] の補間座標を返す
// エンドポイントはクランプ（先端・末端の接線を平坦化）
function catmullRomPt(pts, frac){
  const n = pts.length;
  if (n < 2) return (pts[0] || [0,0]);
  const f  = Math.max(0, Math.min(1, frac)) * (n - 1);
  const i1 = Math.min(Math.floor(f), n - 2);
  const t  = f - i1;
  const p0 = pts[Math.max(0, i1 - 1)];
  const p1 = pts[i1];
  const p2 = pts[Math.min(n - 1, i1 + 1)];
  const p3 = pts[Math.min(n - 1, i1 + 2)];
  const t2 = t*t, t3 = t2*t;
  return [
    0.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
    0.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)
  ];
}

// スプラインから位置と標高を取得（RS_LINEが空なら線形にフォールバック）
function sampleSpline(frac){
  if (RS_LINE.length < 2) return sampleAt(frac * TOTAL);
  const pos = catmullRomPt(RS_LINE, frac);
  const n = RS_ELES.length;
  const f = Math.max(0, Math.min(1, frac)) * (n - 1);
  const i = Math.min(Math.floor(f), n - 2);
  const t = f - i;
  const e1 = RS_ELES[i], e2 = RS_ELES[i + 1];
  const ele = (e1 != null && e2 != null) ? e1 + (e2 - e1)*t : (e1 != null ? e1 : e2);
  return { pos, ele };
}

// スプライン接線方向から bearing を計算（GPS ノイズに依存しない滑らかな方向）
function splineBearing(frac){
  // RS_LINE の 2点分先を参照 → 急な方向変化を防ぐ安定した接線
  const eps = 2.0 / RS_LINE.length;
  const a = catmullRomPt(RS_LINE, Math.max(0, frac));
  const b = catmullRomPt(RS_LINE, Math.min(1, frac + eps));
  // ほぼ同じ点なら現在のベアリングを維持
  if (Math.abs(a[0]-b[0]) < 1e-9 && Math.abs(a[1]-b[1]) < 1e-9) return camBearing;
  return bearing(a, b);
}

// カメラ平滑化用の現在値（毎フレーム目標へ少しずつ寄せる）
let camLon = 0, camLat = 0;  // 現在のカメラ中心（補間済）
let camBearing = 0;           // 現在のカメラ方位（補間済）
let camInit = false;
let RS_LINE = [];              // 等距離リサンプル点 [[lon,lat], ...]
let RS_ELES = [];              // リサンプル点の標高
let camZoom  = 12.2;           // ダンプ追従zoom（毎フレームlerp）
let camPitch = 45;             // ダンプ追従pitch（毎フレームlerp）
let playEase = 0;              // ease-in フェーダー 0→1

// 現在地周辺の進行方向を、少し先読みして安定させる
function travelBearing(distM){
  const ahead = Math.min(TOTAL, distM + Math.max(80, TOTAL*0.01));
  const a = sampleAt(distM).pos;
  const b = sampleAt(ahead).pos;
  return bearing(a, b);
}

// カメラをマーカーにダンプ追従させる（位置・bearing・zoom・pitch すべてlerp）
function updateCamera(s, frac){
  if (camMode === 'off') return;

  const tb = RS_LINE.length >= 2 ? splineBearing(frac) : travelBearing(frac * TOTAL);
  const tz = camMode === 'chase' ? 14.2 : 12.2;
  const tp = camMode === 'chase' ? 68   : 45;

  // 初回フレームは目標値にスナップ（lerp開始前のワープ防止）
  if (!camInit){
    camLon = s.pos[0]; camLat = s.pos[1];
    camBearing = tb; camZoom = tz; camPitch = tp;
    camInit = true;
  }

  // 位置: α=0.08 ≒ 60fpsで約200msのラグ → 衛星タイルの先読みを確保
  camLon  += (s.pos[0] - camLon)  * 0.08;
  camLat  += (s.pos[1] - camLat)  * 0.08;
  // bearing: 0°/360°またぎを正しく処理しつつ α=0.06 でゆっくり旋回
  camBearing = lerpAngle(camBearing, tb, 0.06);
  // zoom/pitch: α=0.05 でなめらかにモード切替に追従
  camZoom  += (tz - camZoom)  * 0.05;
  camPitch += (tp - camPitch) * 0.05;

  map.jumpTo({ center:[camLon, camLat], zoom:camZoom, pitch:camPitch, bearing:camBearing });
}

// 現在のprogressに基づいて全要素を更新
function updateScene(){
  const distM = progress * TOTAL;
  // スプラインで補間した位置・標高を使用（RS_LINEが未構築なら線形にフォールバック）
  const s = RS_LINE.length >= 2 ? sampleSpline(progress) : sampleAt(distM);

  // 走行済みライン: RS_LINE の整数インデックス点 + 正確な現在地スプライン点
  let doneCoords;
  if (RS_LINE.length >= 2){
    const iEnd = Math.floor(progress * (RS_LINE.length - 1));
    doneCoords = RS_LINE.slice(0, iEnd + 1).concat([s.pos]);
  } else {
    doneCoords = LINE.slice(0, s.idx).concat([s.pos]);
  }
  if (map.getSource('route-done')){
    const anchor = RS_LINE.length >= 2 ? RS_LINE[0] : LINE[0];
    map.getSource('route-done').setData({ type:'Feature', geometry:{ type:'LineString', coordinates: doneCoords.length>=2 ? doneCoords : [anchor,anchor] } });
  }
  if (map.getSource('bike')){
    map.getSource('bike').setData({ type:'Feature', geometry:{ type:'Point', coordinates: s.pos } });
  }
  document.getElementById('curDist').textContent = (distM/1000).toFixed(1) + ' km';
  document.getElementById('statEle').textContent = s.ele!=null ? Math.round(s.ele) : '–';
  document.getElementById('progressFill').style.width = (progress*100) + '%';

  updateCamera(s, progress);

  if (cinemaMode){ drawElevGraph(); updateCinemaStats(); }
}

// ---- 再生ループ ----
// 全体を走破するおおよその秒数（ゆっくり眺めるペース: 目標90〜120秒）
const BASE_DURATION = 100;

function tick(ts){
  if (!playing) return;
  if (lastTs == null) lastTs = ts;
  const dt = Math.min((ts - lastTs) / 1000, 0.1); // タブ復帰時の大ジャンプをキャップ
  lastTs = ts;

  // ease-in: 再生開始から1.5秒でフルスピードへ滑らかに立ち上げ
  playEase = Math.min(1, playEase + dt / 1.5);
  // ease-out: 末尾5%でスピードを落として滑らかに収束（最低0.1倍速を維持して必ずゴール）
  const easeOut = Math.max(0.1, Math.min(1, progress > 0.95 ? (1 - progress) / 0.05 : 1));

  progress += (dt / BASE_DURATION) * playEase * easeOut;
  if (progress >= 1){ progress = 1; updateScene(); stopPlay(); toast('ゴール！'); return; }

  updateScene();
  rafId = requestAnimationFrame(tick);
}

function startPlay(){
  if (TOTAL <= 0) return;
  if (progress >= 1) progress = 0;
  playing = true; lastTs = null;
  playEase = 0; // ease-in をリセット
  document.getElementById('btnPlay').textContent = '⏸';

  if (camMode !== 'off'){
    const s  = RS_LINE.length >= 2 ? sampleSpline(progress) : sampleAt(progress * TOTAL);
    const tb = RS_LINE.length >= 2 ? splineBearing(progress) : travelBearing(progress * TOTAL);
    const tz = camMode === 'chase' ? 14.2 : 12.2;
    const tp = camMode === 'chase' ? 68   : 45;
    camLon = s.pos[0]; camLat = s.pos[1];
    camBearing = tb; camZoom = tz; camPitch = tp; camInit = true;
    map.easeTo({ center:s.pos, zoom:tz, pitch:tp, bearing:tb, duration:1400 });
    setTimeout(() => { if (playing){ lastTs = null; rafId = requestAnimationFrame(tick); } }, 1400);
  } else {
    rafId = requestAnimationFrame(tick);
  }
}
function stopPlay(){
  playing = false;
  if (rafId) cancelAnimationFrame(rafId);
  document.getElementById('btnPlay').textContent = '▶';
}
function togglePlay(){ playing ? stopPlay() : startPlay(); }

// ---- シネマモード ----
function drawElevGraph(){
  if (elevPts.length < 2) return;
  const cv = document.getElementById('elevCanvas');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);
  const range = elevMeta.maxE - elevMeta.minE || 1;
  const toX = i => (i / (elevPts.length - 1)) * W;
  const toY = e => H - ((e - elevMeta.minE) / range) * (H - 8) - 4;

  // 塗り
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let i = 0; i < elevPts.length; i++) ctx.lineTo(toX(i), toY(elevPts[i]));
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,107,53,0.22)';
  ctx.fill();

  // ライン
  ctx.beginPath();
  for (let i = 0; i < elevPts.length; i++) {
    i === 0 ? ctx.moveTo(toX(i), toY(elevPts[i])) : ctx.lineTo(toX(i), toY(elevPts[i]));
  }
  ctx.strokeStyle = '#ff6b35';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // 現在地カーソル
  const cx = progress * W;
  ctx.beginPath();
  ctx.moveTo(cx, 0);
  ctx.lineTo(cx, H);
  ctx.strokeStyle = '#ffb84d';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function updateCinemaStats(){
  const distM = progress * TOTAL;
  const s = RS_LINE.length >= 2 ? sampleSpline(progress) : sampleAt(distM);
  document.getElementById('cinemaEle').textContent = s.ele != null ? '↑ ' + Math.round(s.ele) + 'm' : '↑ –';
  document.getElementById('cinemaDist').textContent = (distM / 1000).toFixed(1) + ' km';
}

function setCinemaUI(mode){
  const topbar = document.getElementById('topbar');
  const controls = document.getElementById('controls');
  const overlay = document.getElementById('cinema-overlay');
  if (mode === 'on'){
    topbar.style.opacity = '0';
    topbar.style.pointerEvents = 'none';
    controls.style.opacity = '0';
    controls.style.pointerEvents = 'none';
    overlay.style.display = 'block';
    cinemaMode = true;
  } else if (mode === 'off'){
    topbar.style.opacity = '';
    topbar.style.pointerEvents = '';
    controls.style.opacity = '';
    controls.style.pointerEvents = '';
    overlay.style.display = 'none';
    cinemaMode = false;
    document.getElementById('btnCinema').textContent = '🎬 シネマ';
  } else if (mode === 'peek'){
    if (!cinemaMode) return;
    topbar.style.opacity = '1';
    topbar.style.pointerEvents = 'auto';
    controls.style.opacity = '1';
    controls.style.pointerEvents = 'auto';
    clearTimeout(cinemaTapTimer);
    cinemaTapTimer = setTimeout(() => setCinemaUI('on'), 3000);
  }
}

function toggleCinema(){
  if (cinemaMode){
    setCinemaUI('off');
  } else {
    if (TOTAL <= 0){ toast('GPXファイルを先に読み込んでください'); return; }
    setCinemaUI('on');
    drawElevGraph();
    updateCinemaStats();
    document.getElementById('btnCinema').textContent = '✕ 解除';
  }
}

// ---- ファイル読み込み ----
function handleFile(file){
  if (!file) return;
  stopPlay();
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const coords = parseGPX(e.target.result);
      // stats
      let up = 0;
      for (let i=1;i<coords.length;i++){
        if (coords[i].ele!=null && coords[i-1].ele!=null){
          const d = coords[i].ele - coords[i-1].ele;
          if (d>0) up += d;
        }
      }
      window._coords = coords;
      const build = () => {
        buildRoute(coords);
        let total = 0;
        for (let i=1;i<coords.length;i++) total += haversine(coords[i-1],coords[i]);
        document.getElementById('statDist').textContent = (total/1000).toFixed(1);
        document.getElementById('statUp').textContent = Math.round(up);
      };
      if (map.isStyleLoaded()) build(); else map.once('idle', build);

      document.getElementById('loader').style.display = 'none';
      document.getElementById('controls').classList.add('show');
      toast(`読み込み完了：${coords.length}点`);
    }catch(err){
      toast('⚠ ' + err.message);
      console.error(err);
    }
  };
  reader.onerror = () => toast('⚠ ファイルの読み込みに失敗しました');
  reader.readAsText(file);
}

// ---- イベント ----
document.getElementById('fileInput').addEventListener('change', e => handleFile(e.target.files[0]));
document.getElementById('fileInput2').addEventListener('change', e => handleFile(e.target.files[0]));
document.getElementById('btnFit').addEventListener('click', fitRoute);
document.getElementById('btnPlay').addEventListener('click', togglePlay);
document.getElementById('btnReset').addEventListener('click', () => {
  stopPlay(); progress = 0;
  camInit = false; // リセット時はカメラを開始地点にスナップ（徐々に戻るのを防ぐ）
  updateScene();
});

// カメラモードボタン
document.querySelectorAll('.cambtn[data-cam]').forEach(btn => {
  btn.addEventListener('click', () => {
    camMode = btn.dataset.cam;
    document.querySelectorAll('.cambtn[data-cam]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (camMode === 'off'){
      camInit = false;
      fitRoute();
    } else {
      const s  = RS_LINE.length >= 2 ? sampleSpline(progress) : sampleAt(progress * TOTAL);
      const tb = RS_LINE.length >= 2 ? splineBearing(progress) : travelBearing(progress * TOTAL);
      const tz = camMode === 'chase' ? 14.2 : 12.2;
      const tp = camMode === 'chase' ? 68   : 45;
      camLon = s.pos[0]; camLat = s.pos[1];
      camBearing = tb; camZoom = tz; camPitch = tp; camInit = true;
      map.easeTo({ center:s.pos, zoom:tz, pitch:tp, bearing:tb, duration:1000 });
    }
  });
});

// 進捗バーをタップでシーク
document.getElementById('progressBar').addEventListener('click', (e) => {
  const rect = e.currentTarget.getBoundingClientRect();
  const r = (e.clientX - rect.left) / rect.width;
  progress = Math.max(0, Math.min(1, r));
  updateScene();
});

document.getElementById('btnCinema').addEventListener('click', toggleCinema);
map.on('click', () => { if (cinemaMode) setCinemaUI('peek'); });
</script>
